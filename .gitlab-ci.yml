# Guestbook CI/CD
#
#   lint ─▶ test ─▶ build ─▶ scan ─▶ publish ─▶ plan ─▶ deploy ─▶ verify ─▶ rollback (on failure) ─▶ promote (manual)
#
# Merge requests: lint, test, SonarQube, build, Trivy, terraform plan (read-only role)
# main:           all of the above + push image, apply to dev, smoke test, auto-rollback
#                 + manual, approval-gated promotion of the SAME image to prod
#
# Required CI/CD variables (Settings > CI/CD > Variables), nothing is in the repo:
#   AWS_ACCOUNT_ID                                       plain
#   AWS_PLAN_ACCESS_KEY_ID / AWS_PLAN_SECRET_ACCESS_KEY  masked             (read-only role)
#   AWS_DEPLOY_ACCESS_KEY_ID / AWS_DEPLOY_SECRET_ACCESS_KEY  masked + protected (main only)
#   ALERT_EMAIL                                          plain   (CloudWatch alarm recipient)
#   DOCKERHUB_TOKEN                                      masked + protected (Docker Hub access token, Read & Write)
#   SONAR_HOST_URL / SONAR_TOKEN                         instance-level on this GitLab

stages: [lint, test, build, scan, publish, plan, deploy, verify, rollback, promote]

variables:
  AWS_REGION: eu-north-1
  TF_VERSION: "1.16"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ROOT: infra/stack
  IMAGE_NAME: guestbook-api
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  ECR_REGISTRY: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKERHUB_USERNAME: moes98
  DOCKERHUB_REPO: moes98/test2026

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

# ---------------------------------------------------------------------------
# Reusable fragments
# ---------------------------------------------------------------------------
.on_main: &on_main
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.terraform:
  image:
    name: hashicorp/terraform:$TF_VERSION
    entrypoint: [""]
  before_script:
    - apk add --no-cache aws-cli jq curl >/dev/null
    - export TF_VAR_image_tag="$IMAGE_TAG"
    - export TF_VAR_alert_emails="[\"${ALERT_EMAIL}\"]"
  cache:
    key: terraform-providers
    paths: [infra/stack/.terraform/providers]

.tf_init: &tf_init
  - cd "$TF_ROOT"
  - terraform init -reconfigure
      -backend-config=../envs/${ENV}/backend.hcl
      -backend-config="bucket=guestbook-tfstate-${AWS_ACCOUNT_ID}"

.docker:
  image: docker:28
  services: [docker:28-dind]
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 1; done

# ---------------------------------------------------------------------------
# lint
# ---------------------------------------------------------------------------
lint:python:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install -q --root-user-action=ignore ruff==0.16.9
    - cd app/backend && ruff check . && ruff format --check .

lint:dockerfile:
  stage: lint
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint --failure-threshold warning app/backend/Dockerfile app/frontend/Dockerfile

lint:terraform:
  stage: lint
  image:
    name: hashicorp/terraform:$TF_VERSION
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive -diff infra
    - for d in infra/bootstrap infra/stack; do (cd $d && terraform init -backend=false >/dev/null && terraform validate); done

lint:tflint:
  stage: lint
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd infra && tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"

security:checkov:
  stage: lint
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    - checkov -d infra --config-file infra/.checkov.yaml -o cli -o junitxml --output-file-path console,checkov.xml
  artifacts:
    when: always
    reports:
      junit: checkov.xml

security:gitleaks:
  stage: lint
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0 # scan full history, not just the last commit
  script:
    - gitleaks git . --redact --verbose --report-format sarif --report-path gitleaks.sarif
  artifacts:
    when: always
    paths: [gitleaks.sarif]

# ---------------------------------------------------------------------------
# test
# ---------------------------------------------------------------------------
test:unit:
  stage: test
  image: python:3.12-slim
  script:
    - cd app/backend
    - pip install -q --root-user-action=ignore -r requirements-dev.txt
    - pytest --junitxml=report.xml --cov --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths: [app/backend/coverage.xml]
    reports:
      junit: app/backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: app/backend/coverage.xml

sonarqube:
  stage: test
  needs: [test:unit]
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: sonar
    paths: [.sonar/cache]
  script:
    - sonar-scanner -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
  rules:
    - if: $SONAR_HOST_URL && $SONAR_TOKEN

# ---------------------------------------------------------------------------
# build: image is built ONCE per commit, scanned, then promoted unchanged
# ---------------------------------------------------------------------------
build:image:
  stage: build
  extends: .docker
  needs: [lint:dockerfile, test:unit]
  script:
    - docker build --pull
        --build-arg APP_VERSION="$IMAGE_TAG"
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
        --label org.opencontainers.image.source="$CI_PROJECT_URL"
        -t "$IMAGE_NAME:$IMAGE_TAG" app/backend
    - docker image ls "$IMAGE_NAME:$IMAGE_TAG"
    - docker save "$IMAGE_NAME:$IMAGE_TAG" | gzip > image.tar.gz
  artifacts:
    paths: [image.tar.gz]
    expire_in: 1 day

# ---------------------------------------------------------------------------
# scan: gate on HIGH/CRITICAL fixable CVEs before anything is pushed
# ---------------------------------------------------------------------------
scan:trivy:
  stage: scan
  needs: [build:image]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .trivycache
  cache:
    key: trivy
    paths: [.trivycache]
  script:
    - trivy image --input image.tar.gz --format json --output trivy.json
    - trivy convert --format table trivy.json
    - trivy convert --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json trivy.json
    # Gate: fail on fixable HIGH/CRITICAL vulnerabilities (reuses the DB cache from above)
    - trivy image --input image.tar.gz --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --format table
  artifacts:
    when: always
    paths: [trivy.json]
    reports:
      container_scanning: gl-container-scanning-report.json

# ---------------------------------------------------------------------------
# publish (main only)
# ---------------------------------------------------------------------------
publish:image:
  stage: publish
  extends: .docker
  needs: [build:image, scan:trivy]
  script:
    - apk add --no-cache aws-cli >/dev/null
    - . ci/aws-auth.sh deploy
    - docker load < image.tar.gz
    - aws ecr get-login-password | docker login -u AWS --password-stdin "$ECR_REGISTRY"
    # ECR tags are immutable: re-running a pipeline for the same commit is a no-op.
    - |
      if aws ecr describe-images --repository-name "$IMAGE_NAME" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
        echo "ECR already has $IMAGE_TAG"
      else
        docker tag "$IMAGE_NAME:$IMAGE_TAG" "$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
        docker push "$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
      fi
    # Public showcase copy on Docker Hub (reviewers can `docker run` it locally).
    - |
      if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        for t in "$IMAGE_TAG" latest; do
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$DOCKERHUB_REPO:$t"
          docker push "$DOCKERHUB_REPO:$t"
        done
      else
        echo "DOCKERHUB_TOKEN not set, skipping Docker Hub push"
      fi
  rules: *on_main

# ---------------------------------------------------------------------------
# plan
# ---------------------------------------------------------------------------
plan:dev:
  stage: plan
  extends: .terraform
  needs: [lint:terraform, security:checkov]
  variables:
    ENV: dev
  resource_group: tf-dev
  script:
    - . ci/aws-auth.sh plan
    - *tf_init
    - terraform plan -var-file=../envs/dev/terraform.tfvars -out=tfplan
    - terraform show -json tfplan | jq -r '([.resource_changes[]?.change.actions?]|flatten)|{"create":(map(select(.=="create"))|length),"update":(map(select(.=="update"))|length),"delete":(map(select(.=="delete"))|length)}' > tfplan.json
  artifacts:
    paths: [infra/stack/tfplan]
    reports:
      terraform: infra/stack/tfplan.json
    expire_in: 1 day

# ---------------------------------------------------------------------------
# deploy: dev (automatic on main)
# ---------------------------------------------------------------------------
deploy:dev:
  stage: deploy
  extends: .terraform
  needs: [plan:dev, publish:image]
  variables:
    ENV: dev
  resource_group: tf-dev
  environment:
    name: dev
    url: $APP_URL
  interruptible: false
  script:
    - . ci/aws-auth.sh deploy
    - *tf_init
    # Remember what is running now, so the rollback job can return to it.
    - PREV_TASK_DEF=$(aws ecs describe-services --cluster guestbook-dev-cluster --services guestbook-dev-api
        --query 'services[0].taskDefinition' --output text 2>/dev/null || echo none)
    - terraform apply tfplan
    - APP_URL=$(terraform output -raw app_url)
    - BUCKET=$(terraform output -raw frontend_bucket)
    - DIST=$(terraform output -raw cloudfront_distribution_id)
    - echo "Waiting for ECS rolling deployment (circuit breaker auto-rolls back failed tasks)"
    - aws ecs wait services-stable --cluster "$(terraform output -raw ecs_cluster)" --services "$(terraform output -raw ecs_service)"
    - cd "$CI_PROJECT_DIR"
    - aws s3 sync app/frontend "s3://$BUCKET" --delete --exclude "Dockerfile" --exclude "nginx.conf" --cache-control "public,max-age=300"
    - aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*" >/dev/null
    - printf 'APP_URL=%s\nPREV_TASK_DEF=%s\n' "$APP_URL" "$PREV_TASK_DEF" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  rules: *on_main

# ---------------------------------------------------------------------------
# verify
# ---------------------------------------------------------------------------
smoke:dev:
  stage: verify
  image: curlimages/curl:latest
  needs: [deploy:dev]
  script:
    - sh scripts/smoke-test.sh "$APP_URL" "$IMAGE_TAG"
  rules: *on_main

# ---------------------------------------------------------------------------
# rollback: runs only if something above failed on main
# ---------------------------------------------------------------------------
rollback:dev:
  stage: rollback
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  needs:
    - job: deploy:dev
      optional: true
  interruptible: false
  script:
    - . ci/aws-auth.sh deploy
    - |
      if [ -z "${PREV_TASK_DEF:-}" ] || [ "$PREV_TASK_DEF" = "none" ]; then
        echo "No previous task definition recorded (first deploy?), nothing to roll back."; exit 0
      fi
    - echo "Rolling ECS back to $PREV_TASK_DEF"
    - aws ecs update-service --cluster guestbook-dev-cluster --service guestbook-dev-api --task-definition "$PREV_TASK_DEF" >/dev/null
    - aws ecs wait services-stable --cluster guestbook-dev-cluster --services guestbook-dev-api
    - echo "Rolled back. The next successful pipeline on main re-converges Terraform state."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_failure

# ---------------------------------------------------------------------------
# prod: same image digest, manual approval (protected environment)
# ---------------------------------------------------------------------------
deploy:prod:
  stage: promote
  extends: .terraform
  needs: [smoke:dev]
  variables:
    ENV: prod
  resource_group: tf-prod
  environment:
    name: prod
  interruptible: false
  script:
    - . ci/aws-auth.sh deploy
    - *tf_init
    - terraform plan -var-file=../envs/prod/terraform.tfvars -out=tfplan
    - terraform apply tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
