<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Guestbook</h1>
      <p class="sub">Static site on S3 + CloudFront &rarr; API on ECS Fargate &rarr; RDS PostgreSQL</p>
      <p id="status" class="status">Checking API&hellip;</p>
    </header>

    <form id="form">
      <input id="author" name="author" placeholder="Your name" maxlength="64" required>
      <textarea id="body" name="body" placeholder="Leave a message" maxlength="500" required></textarea>
      <button type="submit">Sign the guestbook</button>
    </form>

    <ul id="messages"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
